<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback-Übersicht (intern)</title>
</head>
<body style="margin: 0; background: #F5F2EC; font-family: 'Segoe UI', -apple-system, sans-serif;">
<div id="app-root"></div>
<script>
(function() {
  const READ_FLOW_URL = "https://defaultfde3781c593e4916b77b4850b68789.75.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/2bbe02552a7f45ed94a0575290d49ab7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=6NfVlbrTTlp73eaaWb1bKrFU-NsJOEH3wEwnL2Jjw6E";
  const SAMMEL_MARKER = "Sammelrückmeldung";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function formatDate(isoString) {
    const d = new Date(isoString);
    const tag = String(d.getDate()).padStart(2, "0");
    const monat = String(d.getMonth() + 1).padStart(2, "0");
    const jahr = d.getFullYear();
    const stunde = String(d.getHours()).padStart(2, "0");
    const minute = String(d.getMinutes()).padStart(2, "0");
    return `${tag}.${monat}.${jahr}, ${stunde}:${minute} Uhr`;
  }

  function buildGroupHTML(groupKey, entries) {
    const isSammel = groupKey.indexOf(SAMMEL_MARKER) === 0;
    const landkreis = entries[0].Landkreis || "";
    const antragsnummer = entries[0].Antragsnummer || "";
    const projekttitel = entries[0].Projekttitel || "";
    const antragsteller = entries[0].Antragstellerin || "";

    const entriesHTML = entries.map(function (entry) {
      return `
        <div style="padding: 14px 0; border-top: 1px solid #F0EBE0;">
          <div style="display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap;">
            <strong style="font-size: 13.5px; color: #16232B;">${escapeHtml(entry.Name)} &middot; ${escapeHtml(entry.Organisation)}</strong>
            <span style="font-size: 12px; color: #8A8377; white-space: nowrap;">${formatDate(entry.Created)}</span>
          </div>
          ${isSammel && entry.Antragsnummer ? `<p style="font-size: 12.5px; color: #1B6E8C; font-weight: 600; margin: 0 0 6px;">Betrifft: ${escapeHtml(entry.Antragsnummer)}</p>` : ""}
          <p style="font-size: 13.5px; color: #4A4640; line-height: 1.6; margin: 0; white-space: pre-wrap;">${escapeHtml(entry.Anmerkung)}</p>
          ${entry.EMail ? `<p style="font-size: 12px; color: #8A8377; margin: 6px 0 0;">${escapeHtml(entry.EMail)}</p>` : ""}
        </div>
      `;
    }).join("");

    if (isSammel) {
      return `
  <div class="feedback-group" data-landkreis="${escapeHtml(landkreis)}" data-sammel="true" style="position: relative; background: #FFF9F0; border: 1px solid #F0DCB8; border-radius: 14px; padding: 18px 90px 18px 20px;">
    <div>
      <h3 style="font-size: 15px; font-weight: 600; color: #B4790A; margin: 0 0 2px;">Sammelrückmeldung</h3>
      <p style="font-size: 13px; color: #4A4640; margin: 0;">${escapeHtml(landkreis)}</p>
    </div>
    <button class="copy-btn" data-projekt-id="${escapeHtml(groupKey)}" style="position: absolute; top: 18px; right: 20px; padding: 6px 12px; background: #B4790A; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">Kopieren</button>
    ${entriesHTML}
  </div>
  `;
    }

    return `
  <div class="feedback-group" data-landkreis="${escapeHtml(landkreis)}" style="position: relative; background: #FDFCFA; border: 1px solid #EFEAE0; border-radius: 14px; padding: 18px 90px 18px 20px;">
    <div>
      <h3 style="font-size: 15px; font-weight: 600; color: #1B6E8C; margin: 0 0 2px;">Projekt-ID ${escapeHtml(groupKey)}</h3>
      <p style="font-size: 13px; color: #4A4640; margin: 0;"><strong>${escapeHtml(projekttitel)}</strong> &middot; ${escapeHtml(antragsteller)} &middot; ${escapeHtml(landkreis)} &middot; ${escapeHtml(antragsnummer)}</p>
    </div>
    <button class="copy-btn" data-projekt-id="${escapeHtml(groupKey)}" style="position: absolute; top: 18px; right: 20px; padding: 6px 12px; background: #1B6E8C; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">Kopieren</button>
    ${entriesHTML}
  </div>
  `;
  }

  function buildCopyText(entries) {
    return entries.map(function (entry) {
      if (entry.Antragsnummer) {
        return `Betrifft: ${entry.Antragsnummer}\n${entry.Anmerkung}`;
      }
      return entry.Anmerkung;
    }).join("\n\n---\n\n");
  }

  function renderGroups(groupedData, filterLandkreis, container, countEl) {
    const groupKeys = Object.keys(groupedData).sort(function (a, b) {
      const aSammel = a.indexOf(SAMMEL_MARKER) === 0;
      const bSammel = b.indexOf(SAMMEL_MARKER) === 0;
      if (aSammel && !bSammel) return 1;
      if (bSammel && !aSammel) return -1;
      if (aSammel && bSammel) {
        // Beide Sammelrückmeldungen: zuerst nach Landkreis, dann chronologisch
        const aEntry = groupedData[a][0];
        const bEntry = groupedData[b][0];
        const lkCompare = (aEntry.Landkreis || "").localeCompare(bEntry.Landkreis || "");
        if (lkCompare !== 0) return lkCompare;
        return new Date(aEntry.Created) - new Date(bEntry.Created);
      }
      return a.localeCompare(b);
    });
    let visibleCount = 0;
    let html = "";

    groupKeys.forEach(function (groupKey) {
      const entries = groupedData[groupKey];
      const landkreis = entries[0].Landkreis || "";
      if (filterLandkreis && landkreis !== filterLandkreis) return;
      visibleCount += entries.length;
      html += buildGroupHTML(groupKey, entries);
    });

    container.innerHTML = html || `<p style="color: #8A8377;">Keine Einträge für diese Auswahl.</p>`;
    countEl.textContent = visibleCount + " Rückmeldung" + (visibleCount === 1 ? "" : "en");

    container.querySelectorAll(".copy-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const pid = btn.getAttribute("data-projekt-id");
        const text = buildCopyText(groupedData[pid]);
        navigator.clipboard.writeText(text).then(function () {
          const original = btn.textContent;
          btn.textContent = "Kopiert!";
          setTimeout(function () { btn.textContent = original; }, 1500);
        });
      });
    });
  }

  function groupByProjektID(items) {
    const grouped = {};
    items.forEach(function (item) {
      const rawPid = item.ProjektID || "(ohne ID)";
      // Jede Sammelrückmeldung ist eine eigenständige Abgabe einer Person
      // und darf NICHT mit anderen Sammelrückmeldungen derselben Region
      // zusammengefasst werden (jede braucht ihren eigenen Kopier-Button).
      // Der eindeutige Zeitstempel (Created) macht jeden Schlüssel einzigartig.
      const pid = rawPid === SAMMEL_MARKER
        ? SAMMEL_MARKER + "::" + (item.Landkreis || "") + "::" + item.Created
        : rawPid;
      if (!grouped[pid]) grouped[pid] = [];
      grouped[pid].push(item);
    });
    Object.values(grouped).forEach(function (entries) {
      entries.sort(function (a, b) { return new Date(a.Created) - new Date(b.Created); });
    });
    return grouped;
  }

  async function loadFeedback(root) {
    root.innerHTML = `
      <div style="max-width: 900px; margin: 0 auto; padding: 36px 24px 60px; box-sizing: border-box;">
        <h1 style="font-size: 22px; font-weight: 600; color: #16232B; margin: 0 0 4px;">Feedback-Übersicht</h1>
        <p style="font-size: 13px; color: #8A8377; margin: 0 0 20px;">Gruppiert nach Projekt-ID, zum Übertragen in die Arbeitstabelle. Sammelrückmeldungen erscheinen als letzter Punkt je Landkreis.</p>
        <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
          <label style="font-size: 13px; font-weight: 600; color: #16232B;">Landkreis:</label>
          <select id="lk-filter" style="padding: 9px 14px; border: 1.5px solid #E8E1D3; border-radius: 10px; font-size: 13.5px; background: #FBFAF7; min-width: 220px;">
            <option value="">Alle Landkreise</option>
          </select>
          <span id="result-count" style="font-size: 13px; color: #8A8377; margin-left: auto;"></span>
        </div>
        <div id="groups-container" style="display: flex; flex-direction: column; gap: 16px;"><p style="color: #8A8377;">Lädt...</p></div>
      </div>
    `;

    const container = document.getElementById("groups-container");
    const countEl = document.getElementById("result-count");
    const select = document.getElementById("lk-filter");

    try {
      const response = await fetch(READ_FLOW_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      });

      if (!response.ok) {
        container.innerHTML = `<p style="color: #B00020;">Fehler beim Laden (Status ${response.status}).</p>`;
        return;
      }

      const data = await response.json();
      const items = data.value || data;

      if (!items || !items.length) {
        container.innerHTML = `<p style="color: #8A8377;">Noch keine Rückmeldungen vorhanden.</p>`;
        return;
      }

      const grouped = groupByProjektID(items);
      const landkreise = new Set();
      Object.values(grouped).forEach(function (entries) {
        if (entries[0].Landkreis) landkreise.add(entries[0].Landkreis);
      });
      Array.from(landkreise).sort().forEach(function (lk) {
        const opt = document.createElement("option");
        opt.value = lk;
        opt.textContent = lk;
        select.appendChild(opt);
      });

      renderGroups(grouped, "", container, countEl);
      select.addEventListener("change", function (e) {
        renderGroups(grouped, e.target.value, container, countEl);
      });
    } catch (err) {
      container.innerHTML = `<p style="color: #B00020;">Fehler: ${escapeHtml(err.message)}</p>`;
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    loadFeedback(document.getElementById("app-root"));
  });
})();
</script>
</body>
</html>
