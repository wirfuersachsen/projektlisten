<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Power Automate Flow-Test</title>
</head>
<body style="font-family: sans-serif; padding: 40px; max-width: 600px; margin: 0 auto;">
  <h2>Power-Automate-Flow-Test</h2>
  <p>Klick den Button, um Testdaten an den Flow zu senden.</p>
  <button onclick="testFlow()" style="padding: 12px 20px; font-size: 14px; cursor: pointer;">Testdaten senden</button>
  <pre id="result" style="margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; word-break: break-all;"></pre>

<script>
const FLOW_URL = "https://defaultfde3781c593e4916b77b4850b68789.75.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/d3da7df08f664768a205de8a6c8b108b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Rm9xPiAwhZ-ZCNN69G2OnutlzfwT1mw8-b5F6vcKUDA";

function log(msg) {
  document.getElementById("result").textContent += msg + "\n\n";
}

async function testFlow() {
  document.getElementById("result").textContent = "";
  try {
    log("Sende Testdaten an den Flow...");
    const response = await fetch(FLOW_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        landkreis: "Testregion",
        projektID: "TEST-0001",
        antragsnummer: "TEST",
        name: "Testperson",
        organisation: "Testverein",
        email: "test@example.com",
        anmerkung: "Dies ist ein automatischer Flow-Test."
      })
    });

    log("Antwort Status: " + response.status);
    const text = await response.text();
    log("Antwort-Text: " + (text || "(leer)"));

    if (response.ok) {
      log("✅ Anfrage erfolgreich gesendet. Bitte in Power Automate prüfen, ob der Flow gelaufen ist und der SharePoint-Eintrag erstellt wurde.");
    } else {
      log("❌ Fehlerhafte Antwort.");
    }
  } catch (err) {
    log("❌ AUSNAHME: " + err.message);
  }
}
</script>
</body>
</html>
